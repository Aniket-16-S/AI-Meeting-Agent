services:
  # 1. FastAPI Backend API (with embedded background worker thread)
  - type: web
    name: meeting-agent-backend
    env: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free # Can be upgraded as needed
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: meeting-agent-db
          property: connectionString
      - key: RABBITMQ_URL
        sync: false # Set to CloudAMQP URL
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_V2
        sync: false
      - key: START_WORKER_IN_BACKEND
        value: "true"
      - key: PORT
        value: 8000

  # 2. Next.js Frontend
  - type: web
    name: meeting-agent-frontend
    env: docker
    dockerfilePath: frontend/Dockerfile
    dockerContext: frontend
    plan: free
    envVars:
      - key: NEXT_PUBLIC_BACKEND_URL
        value: http://meeting-agent-backend:8000
      - key: PORT
        value: 3000

# 3. Managed PostgreSQL Database
databases:
  - name: meeting-agent-db
    plan: free
    postgresMajorVersion: 16
